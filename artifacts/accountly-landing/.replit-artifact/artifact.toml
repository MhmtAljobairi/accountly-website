kind = "web"
previewPath = "/"
title = "Accountly Landing Page"
version = "1.0.0"
id = "artifacts/accountly-landing"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22931

[services.development]
run = "pnpm --filter @workspace/accountly-landing run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/accountly-landing", "run", "build" ]
publicDir = "artifacts/accountly-landing/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22931"
BASE_PATH = "/"
